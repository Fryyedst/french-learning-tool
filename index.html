<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eaf5ff" />
    <title>法语每日单词</title>
    <link rel="stylesheet" href="styles.css?v=4" />
  </head>
  <body data-screen="start">
    <div class="background-orb background-orb--one" aria-hidden="true"></div>
    <div class="background-orb background-orb--two" aria-hidden="true"></div>

    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="返回首页">
          <span class="brand__mark">FR</span>
          <span class="brand__name">法语每日单词</span>
        </a>
        <span class="level-badge">B2 · 3,000 词</span>
      </header>

      <section class="app-card" aria-live="polite">
        <div id="screen-start" class="screen screen--active">
          <div class="start-hero">
            <div class="home-topline">
              <p class="home-word">bonjour</p>
              <button id="history-button" class="history-button" type="button">历史学习记录</button>
            </div>

            <section class="daily-sentence-card" aria-label="今日法语短句">
              <p id="daily-sentence-fr" class="daily-sentence-fr"></p>
              <p id="daily-sentence-zh" class="daily-sentence-zh"></p>
            </section>

            <p id="home-status" class="home-status" aria-live="polite"></p>

            <div class="home-actions">
              <button id="learn-button" class="primary-button" type="button">
                学习新单词
                <span aria-hidden="true">＋</span>
              </button>
              <button id="review-button" class="secondary-button" type="button">
                复习单词
                <span aria-hidden="true">↻</span>
              </button>
            </div>
          </div>
        </div>

        <div id="screen-quiz" class="screen" hidden>
          <div class="quiz-header">
            <div>
              <p id="question-count" class="question-count">随机练习 · 1 / 30</p>
              <div class="score-row">
                <span id="score-text" class="score-text"></span>
                <span id="stage-badge" class="retry-badge">第一轮 · 看词选义</span>
              </div>
            </div>
            <div class="quiz-status">
              <div id="word-dots" class="word-dots" aria-label="当前单词绿点进度">
                <span class="word-dot"></span>
                <span class="word-dot"></span>
                <span class="word-dot"></span>
              </div>
              <span id="correct-mark" class="correct-mark" hidden>正确</span>
            </div>
          </div>

          <div class="progress-track" aria-hidden="true">
            <div id="progress-bar" class="progress-bar"></div>
          </div>

          <div class="question-area">
            <div id="choice-prompt">
              <p class="question-label">它的中文意思是？</p>
              <h2 id="french-word" class="french-word">bonjour</h2>
            </div>

            <div id="sentence-prompt" hidden>
              <p class="question-label">选择正确的单词补全句子</p>
              <p id="sentence-fr" class="sentence-fr"></p>
            </div>

            <div id="fill-prompt" hidden>
              <p class="question-label">根据中文意思填写完整法语单词</p>
              <p id="fill-chinese" class="fill-chinese"></p>
              <p id="blanked-word" class="blanked-word"></p>
            </div>

            <button id="speak-button" class="speak-button" type="button" aria-label="播放当前法语发音">
              <svg class="speak-button__icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 9v6h4l5 4V5L8 9H4Z"></path>
                <path d="M16 8.5a4.5 4.5 0 0 1 0 7"></path>
                <path d="M18.5 6a8 8 0 0 1 0 12"></path>
              </svg>
              <span>播放发音</span>
            </button>
            <p id="speech-status" class="speech-status" aria-live="polite"></p>
          </div>

          <div id="options" class="options" role="group" aria-label="答案选项"></div>

          <form id="fill-form" class="fill-form" hidden>
            <label for="fill-input">填写完整单词</label>
            <input
              id="fill-input"
              class="fill-input"
              type="text"
              lang="fr"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="none"
              spellcheck="false"
              placeholder="在这里输入法语单词"
            />
            <div id="accent-buttons" class="accent-buttons" aria-label="重音符号快捷按钮"></div>
            <button id="fill-submit" class="primary-button" type="submit">检查答案</button>
          </form>

          <div id="feedback" class="feedback" aria-live="assertive"></div>

          <button id="next-button" class="primary-button next-button" type="button" hidden>
            下一题
            <span aria-hidden="true">→</span>
          </button>
        </div>

        <div id="screen-result" class="screen" hidden>
          <div class="result-content">
            <span class="eyebrow">本组完成</span>
            <h1 id="result-title">学习完成啦</h1>
            <div class="score-circle">
              <strong id="result-score">0</strong>
              <span>/ <span id="result-total">10</span></span>
            </div>
            <p id="result-message" class="result-message"></p>
            <p id="result-summary" class="result-summary"></p>
            <div class="result-actions">
              <button id="restart-button" class="primary-button" type="button">
                再学 10 个
                <span aria-hidden="true">＋</span>
              </button>
              <button id="home-button" class="secondary-button" type="button">
                返回首页
                <span aria-hidden="true">⌂</span>
              </button>
            </div>
          </div>
        </div>

        <div id="screen-empty" class="screen" hidden>
          <div class="result-content">
            <span class="eyebrow">提示</span>
            <h1>暂无内容</h1>
            <p id="empty-message" class="result-message"></p>
            <button id="empty-home-button" class="primary-button" type="button">返回首页</button>
          </div>
        </div>

        <div id="screen-history" class="screen" hidden>
          <div class="history-content">
            <div class="history-topbar">
              <div>
                <span class="eyebrow">学习回看</span>
                <h1>历史学习记录</h1>
              </div>
              <button id="history-home-button" class="secondary-button" type="button">返回首页</button>
            </div>
            <div id="history-list" class="history-list"></div>
          </div>
        </div>
      </section>

      <footer class="footer-note">每天 10 个 B2 新单词 · 学习进度保存在本机</footer>
    </main>

    <script src="sentences.js?v=4"></script>
    <script src="examples.js?v=4"></script>
    <script src="data.js?v=4"></script>
    <script src="app.js?v=4"></script>
  </body>
</html>
